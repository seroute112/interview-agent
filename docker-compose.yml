services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # 前端 UI
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: interview-ui
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_BASE=http://api:8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped